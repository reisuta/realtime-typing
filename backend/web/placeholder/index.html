<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>realtime-typing</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .card {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
        line-height: 1.7;
      }
      code {
        background: #1e293b;
        padding: 0.15rem 0.4rem;
        border-radius: 0.3rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>realtime-typing</h1>
      <p>
        サーバーは起動していますが、フロントエンドがまだビルドされていません。
      </p>
      <p>
        単一バイナリでUIごと配信するには<br />
        <code>make build</code> を実行してください。
      </p>
      <p>
        開発中は <code>make backend</code> と <code>make frontend</code> を別々の
        ターミナルで起動し、<code>http://localhost:3000</code> を開きます。
      </p>
    </div>
  </body>
</html>
